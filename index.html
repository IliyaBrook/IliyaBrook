<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="32x32"
      href="/favicon_32_32.svg"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('iliyabrook.theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('iliyabrook.lang');
          if (!l) {
            var n = (navigator.language || 'en').toLowerCase();
            l = n.indexOf('ru') === 0 ? 'ru' : (n.indexOf('he') === 0 || n.indexOf('iw') === 0) ? 'he' : 'en';
          }
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-500-latin.woff2" crossorigin />
